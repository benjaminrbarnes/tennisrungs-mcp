name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m build
      - name: Check installed wheel entry points
        run: |
          python -m venv /tmp/tennisrungs-wheel-check
          /tmp/tennisrungs-wheel-check/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/tennisrungs-wheel-check/bin/tennisrungs --help
          /tmp/tennisrungs-wheel-check/bin/tennisrungs-mcp --help
          /tmp/tennisrungs-wheel-check/bin/python -m pip check
